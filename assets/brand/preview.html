gure><img src="svg/crawlie-mascot-black.svg" alt="Crawlie mascot"></figure><figure class="dark"><img src="svg/crawlie-mascot-white.svg" alt="Crawlie mascot inverted"></figure></div></section><section><h2>Optical favicons</h2><div class="fav"><div><img width="16" height="16" src="web/favicon-16.png" alt="16 pixel favicon"><p>16 × 16 native size</p><img class="pixel" width="192" src="web/favicon-16.png" alt="Enlarged 16 pixel favicon"></div><div><img width="32" height="32" src="web/favicon-32.png" alt="32 pixel favicon"><p>32 × 32 native size</p><img class="pixel" width="192" src="web/favicon-32.png" alt="Enlarged 32 pixel favicon"></div><div><img width="48" height="48" src="web/favicon-48.png" alt="48 pixel favicon"><p>48 × 48 native size</p><img class="pixel" width="192" src="web/favicon-48.png" alt="Enlarged 48 pixel favicon"></div></div></section><p><a href="README.md">Usage & file guide</a></p></main></html>
